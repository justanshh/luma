name: fermata
description: Luma, a local-first desktop music player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  audio_service: ^0.18.19
  audio_service_mpris:
    path: third_party/audio_service_mpris
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^2.4.4
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  window_manager: ^0.7.1
  rust_lib_fermata:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3
  build_runner: 2.4.13
  freezed: 2.5.2
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
